services:
  trend-bot:
    build: .
    container_name: trend-bot
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      CHANNEL_ID: ${CHANNEL_ID}
      ADMIN_ID: ${ADMIN_ID}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      LLM_BASE_URL: ${LLM_BASE_URL}
      PROXY_URL: http://127.0.0.1:8080
    volumes:
      - ./db:/app/db
    restart: unless-stopped
    network_mode: "host"
