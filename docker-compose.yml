services:
  trend-bot:
    build: .
    container_name: trend-bot
    network_mode: "host"
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - LLM_BASE_URL=${LLM_BASE_URL}
      - LLM_MODEL=${LLM_MODEL}
      - TZ=Europe/Moscow
      - TRENDS_TIME=${TRENDS_TIME:-09:00}
      # Прокси для внешних API (HackerNews, GitHub, Google News, DeepSeek,
      # Telegraph): sing-box на хосте, 127.0.0.1:8080. При network_mode:
      # "host" 127.0.0.1 из контейнера = 127.0.0.1 хоста, host.docker.internal
      # НЕ резолвится — не использовать!
      # Пустое значение (PROXY_URL=) = прямое подключение.
      - PROXY_URL=${PROXY_URL:-http://127.0.0.1:8080}
    volumes:
      - ./db:/app/db
    restart: unless-stopped

# Открой в браузере: http://<IP_сервера>:8000/
# (network_mode: "host" — приложение слушает порт 8000 прямо на хосте)
