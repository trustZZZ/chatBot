<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trend Scanner — Веб-панель</title>
    <!-- marked: Markdown → HTML через CDN (без npm и build-шагов) -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
      :root {
        --bg: #0d1117;
        --panel: #161b22;
        --panel2: #1c2128;
        --border: #30363d;
        --text: #e6edf3;
        --muted: #8b949e;
        --accent: #58a6ff;
        --green: #3fb950;
        --yellow: #d29922;
        --red: #f85149;
        --purple: #bc8cff;
        --radius: 10px;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font-family:
          -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        line-height: 1.55;
        min-height: 100vh;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
        padding: 18px 24px;
        border-bottom: 1px solid var(--border);
        background: var(--panel);
        position: sticky;
        top: 0;
        z-index: 20;
      }
      header h1 {
        font-size: 20px;
        letter-spacing: 0.3px;
      }
      header .sub {
        color: var(--muted);
        font-size: 12px;
        margin-top: 2px;
      }
      .chips {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .chip {
        font-size: 12px;
        padding: 4px 10px;
        border-radius: 20px;
        border: 1px solid var(--border);
        background: var(--panel2);
        color: var(--muted);
        white-space: nowrap;
      }
      .chip.ok {
        color: var(--green);
        border-color: rgba(63, 185, 80, 0.4);
      }
      .chip.warn {
        color: var(--yellow);
        border-color: rgba(210, 153, 34, 0.4);
      }
      .chip.err {
        color: var(--red);
        border-color: rgba(248, 81, 73, 0.4);
      }
      .sched {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .sched-label {
        font-size: 12px;
        color: var(--muted);
        white-space: nowrap;
      }
      #schedule-time {
        padding: 5px 8px;
        font-size: 13px;
        width: 132px;
        color-scheme: dark;
      }
      main {
        max-width: 1100px;
        margin: 0 auto;
        padding: 24px;
      }
      section {
        margin-bottom: 32px;
      }
      h2 {
        font-size: 16px;
        margin-bottom: 12px;
        color: var(--text);
        display: flex;
        align-items: center;
        gap: 8px;
      }
      h2 .count {
        color: var(--muted);
        font-weight: 400;
        font-size: 13px;
      }
      .toolbar {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-bottom: 16px;
      }
      .btn {
        background: var(--panel2);
        color: var(--text);
        border: 1px solid var(--border);
        padding: 9px 16px;
        border-radius: var(--radius);
        font-size: 14px;
        cursor: pointer;
        transition:
          background 0.15s,
          border-color 0.15s,
          opacity 0.15s;
      }
      .btn:hover:not(:disabled) {
        background: #21262d;
        border-color: var(--accent);
      }
      .btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .btn.primary {
        background: linear-gradient(135deg, #1f6feb, #388bfd);
        border-color: #1f6feb;
        color: #fff;
      }
      .btn.primary:hover:not(:disabled) {
        filter: brightness(1.1);
      }
      .btn.green {
        background: linear-gradient(135deg, #238636, #2ea043);
        border-color: #238636;
        color: #fff;
      }
      .btn.small {
        padding: 5px 10px;
        font-size: 12px;
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 10px;
        margin-bottom: 24px;
      }
      .stat {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 14px 16px;
      }
      .stat .num {
        font-size: 26px;
        font-weight: 700;
        color: var(--accent);
      }
      .stat .lbl {
        font-size: 12px;
        color: var(--muted);
        margin-top: 2px;
      }
      .card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 16px;
        margin-bottom: 12px;
      }
      .empty {
        color: var(--muted);
        font-size: 14px;
        padding: 12px 0;
      }
      .block-header {
        font-size: 13px;
        font-weight: 700;
        color: var(--accent);
        text-transform: uppercase;
        letter-spacing: 0.4px;
        margin: 18px 0 8px;
        padding-bottom: 6px;
        border-bottom: 1px solid var(--border);
      }
      .block-header:first-child {
        margin-top: 0;
      }
      .badge {
        display: inline-block;
        font-size: 11px;
        padding: 2px 8px;
        border-radius: 12px;
        background: var(--panel2);
        border: 1px solid var(--border);
        color: var(--muted);
        margin-right: 6px;
      }
      .badge.score {
        color: var(--yellow);
      }
      .badge.plat {
        color: var(--accent);
        border-color: rgba(88, 166, 255, 0.45);
      }
      .plan-hints {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin: 2px 0 10px;
      }
      .hint-chip {
        font-size: 12px;
        color: var(--yellow);
        background: var(--panel2);
        border: 1px solid rgba(210, 153, 34, 0.35);
        border-radius: 6px;
        padding: 3px 9px;
      }
      .t-title {
        font-size: 15px;
        font-weight: 600;
        margin: 8px 0;
      }
      .t-reason {
        font-size: 13px;
        color: var(--muted);
        background: var(--panel2);
        border-left: 3px solid var(--accent);
        padding: 8px 10px;
        border-radius: 4px;
        margin: 8px 0;
      }
      .t-actions {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }
      select,
      input,
      textarea {
        background: var(--panel2);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 8px 10px;
        font-size: 14px;
        font-family: inherit;
        outline: none;
      }
      select:focus,
      input:focus,
      textarea:focus {
        border-color: var(--accent);
      }
      .plans {
        margin-top: 12px;
        display: grid;
        gap: 10px;
      }
      .plan {
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 12px 14px;
        background: var(--panel2);
      }
      .plan h4 {
        font-size: 14px;
        margin-bottom: 6px;
        display: flex;
        justify-content: space-between;
        gap: 8px;
        align-items: center;
      }
      .plan ul {
        margin: 6px 0 10px 20px;
        font-size: 13px;
        color: var(--muted);
      }
      .plan li {
        margin-bottom: 2px;
      }
      .plan-lbl {
        display: block;
        font-size: 12px;
        color: var(--muted);
        margin: 10px 0 4px;
      }
      .plan-lbl input {
        display: block;
        width: 100%;
        margin-top: 4px;
      }
      .point-row {
        display: flex;
        gap: 8px;
        align-items: flex-start;
        margin-bottom: 8px;
      }
      .point-row textarea {
        flex: 1;
        resize: vertical;
        min-height: 44px;
      }
      .point-row .btn {
        white-space: nowrap;
        margin-top: 2px;
      }
      .plan-sub {
        font-size: 13px;
        color: var(--accent);
        margin: 14px 0 8px;
        font-weight: 600;
      }
      .plan-lbl textarea {
        display: block;
        width: 100%;
        margin-top: 4px;
        resize: vertical;
      }
      .plan-section {
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 10px 12px;
        margin-bottom: 10px;
        background: var(--panel);
      }
      .sec-head {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-bottom: 6px;
      }
      .sec-head input {
        flex: 1;
      }
      .sec-num {
        font-size: 11px;
        font-weight: 700;
        color: var(--purple);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 2px 6px;
        white-space: nowrap;
      }
      .sec-meta {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-top: 10px;
      }
      .sec-points {
        margin-top: 6px;
      }
      .obj-row {
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 10px 12px;
        margin-bottom: 10px;
        background: var(--panel);
      }
      .obj-fields {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-bottom: 8px;
      }
      .obj-row > .btn {
        float: right;
      }
      @media (max-width: 640px) {
        .sec-meta,
        .obj-fields {
          grid-template-columns: 1fr;
        }
        .obj-row > .btn {
          float: none;
        }
      }
      .hint {
        font-size: 12px;
        color: var(--muted);
        margin-top: 8px;
      }
      .error {
        color: var(--red);
        font-size: 13px;
        margin-top: 8px;
      }
      .loader {
        display: inline-block;
        width: 16px;
        height: 16px;
        border: 2px solid var(--border);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        vertical-align: middle;
        margin-right: 8px;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      details {
        border: 1px solid var(--border);
        border-radius: var(--radius);
        margin-bottom: 8px;
        background: var(--panel2);
      }
      summary {
        cursor: pointer;
        padding: 10px 14px;
        font-size: 13px;
        color: var(--muted);
        user-select: none;
      }
      .article-body {
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 16px 18px;
        margin: 10px 0;
        background: #fff;
        color: #1f2328;
        font-size: 15px;
      }
      .article-body h2 {
        color: #1f2328;
        font-size: 20px;
        margin: 16px 0 8px;
        display: block;
      }
      .article-body h3 {
        color: #1f2328;
        font-size: 17px;
        margin: 12px 0 6px;
      }
      .article-body p {
        margin: 8px 0;
      }
      .article-body a {
        color: #0969da;
        text-decoration: none;
      }
      .article-body a:hover {
        text-decoration: underline;
      }
      .article-body ul,
      .article-body ol {
        margin: 8px 0 8px 22px;
      }
      .article-body li {
        margin: 4px 0;
      }
      .article-body strong {
        font-weight: 700;
      }
      .factcheck {
        white-space: pre-wrap;
        font-size: 13px;
        color: var(--text);
        padding: 12px 14px;
        line-height: 1.6;
      }
      .art-actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 10px;
      }
      .expert-block {
        border: 1px solid rgba(188, 140, 255, 0.35);
        background: rgba(188, 140, 255, 0.07);
        border-radius: var(--radius);
        padding: 10px 12px;
        margin-bottom: 12px;
      }
      .expert-head {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
        margin-bottom: 8px;
      }
      .expert-rating {
        font-size: 14px;
        font-weight: 700;
        color: var(--yellow);
      }
      .expert-rec {
        font-size: 12px;
        padding: 3px 10px;
        border-radius: 20px;
        background: var(--panel2);
        border: 1px solid var(--border);
        color: var(--muted);
      }
      .expert-rec.ok {
        color: var(--green);
        border-color: rgba(63, 185, 80, 0.4);
      }
      .expert-rec.warn {
        color: var(--yellow);
        border-color: rgba(210, 153, 34, 0.4);
      }
      .expert-block details summary {
        cursor: pointer;
        font-size: 13px;
        color: var(--accent);
        user-select: none;
      }
      footer {
        padding: 20px 24px;
        border-top: 1px solid var(--border);
        color: var(--muted);
        font-size: 12px;
        text-align: center;
      }
      #toast {
        position: fixed;
        right: 20px;
        bottom: 20px;
        z-index: 100;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .toast-item {
        background: var(--panel2);
        border: 1px solid var(--border);
        border-left: 4px solid var(--accent);
        padding: 10px 14px;
        border-radius: 8px;
        font-size: 13px;
        max-width: 380px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
        animation: fadein 0.2s ease;
      }
      .toast-item.ok {
        border-left-color: var(--green);
      }
      .toast-item.err {
        border-left-color: var(--red);
      }
      @keyframes fadein {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @media (max-width: 640px) {
        main {
          padding: 16px;
        }
      }
      /* ---------- Markdown (контейнер .article-content) ---------- */
      .article-content h1 {
        font-size: 1.6em;
        margin: 1em 0 0.5em;
      }
      .article-content h2 {
        font-size: 1.4em;
        margin: 1em 0 0.5em;
      }
      .article-content h3 {
        font-size: 1.2em;
        margin: 0.8em 0 0.4em;
      }
      .article-content p {
        margin: 0.5em 0;
        line-height: 1.6;
      }
      .article-content ul,
      .article-content ol {
        margin: 0.5em 0;
        padding-left: 1.5em;
      }
      .article-content li {
        margin: 0.2em 0;
      }
      .article-content code {
        background: #f4f4f4;
        padding: 2px 6px;
        border-radius: 3px;
        font-family: monospace;
        font-size: 0.9em;
      }
      .article-content pre {
        background: #1e1e1e;
        color: #d4d4d4;
        padding: 1em;
        border-radius: 6px;
        overflow-x: auto;
        margin: 1em 0;
      }
      .article-content pre code {
        background: none;
        color: inherit;
        padding: 0;
      }
      .article-content blockquote {
        border-left: 3px solid #ccc;
        margin: 0.5em 0;
        padding-left: 1em;
        color: #666;
      }
      .article-content table {
        border-collapse: collapse;
        width: 100%;
        margin: 1em 0;
      }
      .article-content th,
      .article-content td {
        border: 1px solid #ddd;
        padding: 8px 12px;
        text-align: left;
      }
      .article-content th {
        background: #f0f0f0;
        font-weight: bold;
      }
      .article-content a {
        color: #0066cc;
        text-decoration: none;
      }
      .article-content a:hover {
        text-decoration: underline;
      }
      .article-content img {
        max-width: 100%;
        border-radius: 6px;
      }
    </style>
  </head>
  <body>
    <header>
      <div>
        <h1>📡 Trend Scanner</h1>
        <div class="sub">Сбор трендов · генерация статей · экспертиза</div>
      </div>
      <div
        style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap"
      >
        <div class="chips" id="status-chips">
          <span class="chip">загрузка…</span>
        </div>
        <div class="sched">
          <label class="sched-label" for="schedule-time">⏰ Сбор:</label>
          <input
            type="time"
            id="schedule-time"
            title="Время ежедневного автосбора (МСК)"
          />
          <button class="btn small" id="btn-save-schedule">
            💾 Сохранить время
          </button>
        </div>
      </div>
    </header>

    <main>
      <section>
        <div class="toolbar">
          <button class="btn primary" id="btn-collect">
            🔄 Собрать тренды
          </button>
          <button class="btn" id="btn-refresh">🗂 Обновить списки</button>
        </div>
        <div class="stats" id="stats"></div>
      </section>

      <section id="found-section" hidden>
        <h2>🌐 Найденные темы <span class="count" id="found-count"></span></h2>
        <div class="toolbar">
          <button class="btn green" id="btn-select" disabled>
            ✅ Выбрать отмеченные
          </button>
          <span class="hint" id="found-hint"></span>
        </div>
        <div id="found-topics"></div>
      </section>

      <section>
        <h2>📰 Темы дня <span class="count" id="topics-count"></span></h2>
        <div id="topics"></div>
      </section>

      <section>
        <h2>📄 Статьи <span class="count" id="articles-count"></span></h2>
        <div id="articles"></div>
      </section>
    </main>

    <footer>
      Trend Scanner · веб-панель без Telegram-бота · LLM:
      <span id="llm-model">—</span>
    </footer>
    <div id="toast"></div>

    <script>
      "use strict";

      // Настройка marked (Markdown → HTML) — один раз при инициализации
      if (typeof marked !== "undefined") {
        marked.setOptions({ breaks: true, gfm: true });
      } else {
        console.error("marked library not loaded");
      }

      const $ = (id) => document.getElementById(id);
      const S = {
        // {blocks: [{block_name, themes}]} из /api/trends/collect («Найденные темы»)
        found_blocks: { blocks: [] },
        checked: new Set(), // ключи "блок::индекс" отмеченных тем в «Найденные темы»
        topics: [], // выбранные темы в БД («Темы дня»)
        platform: {}, // topic_id -> выбранная платформа
        plansByTopic: {}, // topic_id -> {plans, platform_name, style}
        articles: [],
        platforms: [],
      };

      // ---------- Утилиты ----------
      function esc(s) {
        const AMP = String.fromCharCode(38);
        const ent = (c) => AMP + "#" + c.charCodeAt(0) + ";";
        return String(s ?? "").replace(/[&<>"']/g, ent);
      }
      function stripHtml(h) {
        const d = document.createElement("div");
        d.innerHTML = h || "";
        return d.textContent || "";
      }
      // Markdown → HTML с проверкой загрузки библиотеки и защитой от ошибок
      function renderMarkdown(src) {
        const text = String(src ?? "");
        if (typeof marked === "undefined") {
          console.error("marked library not loaded");
          return esc(text || "Текст статьи не доступен");
        }
        try {
          return marked.parse(text);
        } catch (e) {
          console.error("Ошибка рендеринга Markdown", e);
          return esc(text);
        }
      }
      function fmtDt(iso) {
        if (!iso) return "—";
        const d = new Date(iso);
        return d.toLocaleString("ru-RU", {
          day: "2-digit",
          month: "2-digit",
          hour: "2-digit",
          minute: "2-digit",
        });
      }
      function toast(msg, type) {
        const el = document.createElement("div");
        el.className = "toast-item " + (type || "");
        el.textContent = msg;
        $("toast").appendChild(el);
        setTimeout(() => el.remove(), 5000);
      }
      async function api(path, opts) {
        const init = { headers: { "Content-Type": "application/json" } };
        if (opts?.method) init.method = opts.method;
        if (opts?.body) init.body = JSON.stringify(opts.body);
        const r = await fetch(path, init);
        let data = null;
        try {
          data = await r.json();
        } catch (_) {}
        if (!r.ok) {
          const msg =
            data && data.detail
              ? typeof data.detail === "string"
                ? data.detail
                : JSON.stringify(data.detail)
              : "HTTP " + r.status;
          throw new Error(msg);
        }
        return data;
      }
      async function busy(btn, fn) {
        const old = btn.innerHTML,
          was = btn.disabled;
        btn.disabled = true;
        btn.innerHTML = '<span class="loader"></span>…';
        try {
          await fn();
        } catch (e) {
          console.error(e);
          toast(e.message, "err");
        } finally {
          btn.disabled = was;
          btn.innerHTML = old;
        }
      }

      // ---------- Статус и статистика ----------
      let STATUS = null;
      async function loadStatus() {
        try {
          STATUS = await api("/api/status");
          const chips = $("status-chips");
          chips.innerHTML = "";
          const st = STATUS.state || {};
          const sched = STATUS.scheduler_running
            ? `<span class="chip ok">⏰ Автосбор ${esc(STATUS.trends_time)} МСК · след. ${fmtDt(STATUS.next_daily_run)}</span>`
            : `<span class="chip warn">⏰ Планировщик выключен</span>`;
          const llm = STATUS.llm_configured
            ? `<span class="chip ok">🧠 LLM: ${esc(STATUS.llm_model)}</span>`
            : `<span class="chip err">🧠 LLM не настроен</span>`;
          const prx = STATUS.proxy
            ? `<span class="chip">🛰 Прокси: ${esc(STATUS.proxy)}</span>`
            : `<span class="chip">🛰 Прямое подключение</span>`;
          chips.innerHTML = sched + llm + prx;
          $("llm-model").textContent = STATUS.llm_model || "—";
          renderStats();
        } catch (e) {
          toast("Не удалось получить статус: " + e.message, "err");
        }
      }
      function renderStats() {
        const st = STATUS?.state || {};
        const foundTotal = (
          (S.found_blocks && S.found_blocks.blocks) ||
          []
        ).reduce((sum, b) => sum + (b.themes || []).length, 0);
        const nums = [
          {
            n: foundTotal || st.last_collect_count || 0,
            l: "Собрано трендов",
            t: st.last_collect ? fmtDt(st.last_collect) : "",
          },
          { n: S.topics.length, l: "Тем в БД" },
          { n: S.articles.length, l: "Статей" },
          {
            n: st.last_daily ? "✓" : "—",
            l: "Последний автосбор",
            t: st.last_daily ? fmtDt(st.last_daily) : "",
          },
        ];
        $("stats").innerHTML = nums
          .map(
            (x) =>
              `<div class="stat"><div class="num">${esc(x.n)}</div><div class="lbl">${esc(x.l)}</div>` +
              (x.t ? `<div class="lbl">${esc(x.t)}</div>` : "") +
              `</div>`,
          )
          .join("");
      }

      // ---------- Расписание автосбора ----------
      async function loadSchedule() {
        try {
          const data = await api("/api/settings/schedule");
          if (data && data.time) $("schedule-time").value = data.time;
        } catch (e) {
          toast("Не удалось получить расписание: " + e.message, "err");
        }
      }
      async function onSaveSchedule() {
        const el = $("schedule-time");
        const time = el.value;
        if (!time) {
          toast("Выбери время сбора (HH:MM).", "err");
          return;
        }
        await busy($("btn-save-schedule"), async () => {
          const data = await api("/api/settings/schedule", {

            body: { time: time },
          });
          if (data && data.time) el.value = data.time;
          toast("Время сбора обновлено", "ok");

      // ---------- Сбор трендов → найденные темы ----------
      async function onCollect() {
        await busy($("btn-collect"), async () => {
          const data = await api("/api/trends/collect", { method: "POST" });
          S.found_blocks = { blocks: data.blocks || [] };
          S.checked.clear();
          renderTopics(data);
          await loadStatus();
          toast(`Найдено тем: ${data.count}`, "ok");
        });
      }
      function renderTopics(data) {
        // Принимает объект с blocks (как из /api/trends/collect): {blocks: [...]}
        // и рендерит каждый блок отдельно: заголовок блока + карточки тем с чекбоксами.
        const src = data && data.blocks ? data : S.found_blocks || {};
        const blocks = Array.isArray(src.blocks) ? src.blocks : [];
        const allTopics = blocks.reduce(
          (acc, b) => acc.concat(b.themes || []),
          [],
        );
        const sec = $("found-section");
        sec.hidden = !allTopics.length;
        $("found-count").textContent = "(" + allTopics.length + ")";
        $("found-hint").textContent = allTopics.length
          ? "Отметь темы, которые хочешь развить в статью."
          : "";
        const wrap = $("found-topics");
        wrap.innerHTML = "";
        blocks.forEach((b, bi) => {
          const themes = b.themes || [];
          if (!themes.length) return;
          const header = document.createElement("div");
          header.className = "block-header";
          header.textContent = "📚 " + (b.block_name || "Темы");
          wrap.appendChild(header);
          themes.forEach((th, ti) =>
            wrap.appendChild(foundTopicCard(th, bi + "::" + ti)),
          );
        });
        updateSelectBtn();
      }
      function foundTopicCard(t, key) {
        const card = document.createElement("div");
        card.className = "card";
        const sources = t.sources || [];
        const srcCount = Number(t.source_count) || sources.length || 0;
        card.innerHTML = `
          <label style="display:flex; gap:12px; align-items:flex-start; cursor:pointer">
            <input type="checkbox" class="found-check" data-key="${key}"
                   style="width:17px; height:17px; margin-top:3px; accent-color:var(--green)">
            <div style="flex:1">
              <div class="t-title" style="margin-top:0">${esc(t.topic)}</div>
              ${t.description ? `<div class="t-reason">📝 ${esc(t.description)}</div>` : ""}
              <div class="hint">🗞 Источников: <b>${srcCount}</b></div>
              ${
                sources.length
                  ? `<details><summary>🔗 Источники (${sources.length})</summary>
                      <ul style="margin:8px 0 0 20px; font-size:13px">
                        ${sources.map((u) => `<li><a href="${esc(u)}" target="_blank" rel="noopener" style="color:var(--accent); word-break:break-all">${esc(u)}</a></li>`).join("")}
                      </ul>
                     </details>`
                  : ""
              }
            </div>
          </label>
        `;
        const chk = card.querySelector(".found-check");
        chk.checked = S.checked.has(key);

          if (chk.checked) S.checked.add(key);
          else S.checked.delete(key);
          updateSelectBtn();
        });

      }
      function updateSelectBtn() {
        $("btn-select").disabled = S.checked.size === 0;
      }
      async function onSelect() {
        await busy($("btn-select"), async () => {
          const blocks = (S.found_blocks && S.found_blocks.blocks) || [];
          const selected = [];
          blocks.forEach((b, bi) => {
            const blockName = (b.block_name || "Темы").trim();
            (b.themes || []).forEach((th, ti) => {
              if (!S.checked.has(bi + "::" + ti)) return;
              selected.push({
                topic: th.topic,
                description: th.description,
                sources: th.sources || [],
                source_count:
                  Number(th.source_count) || (th.sources || []).length || 0,
                block: blockName,
              });
            });
          });
          if (!selected.length) throw new Error("Отметь хотя бы одну тему.");
          const data = await api("/api/topics/select", {
            method: "POST",
            body: { topics: selected },
          });
          S.checked.clear();
          renderTopics();
          await loadTopics();
          toast(`Сохранено тем в «Темы дня»: ${data.saved}`, "ok");
        });
      }

      // ---------- Темы дня ----------
      async function loadTopics() {
        const data = await api("/api/topics");
        S.topics = data.topics;
        renderDailyTopics();
        renderStats();
      }
      function renderDailyTopics() {
        $("topics-count").textContent = "(" + S.topics.length + ")";
        const wrap = $("topics");
        wrap.innerHTML = "";
        if (!S.topics.length) {
          wrap.innerHTML = `<p class="empty">Пока нет тем. Собери тренды и отметь понравившиеся темы в «🌐 Найденные темы».</p>`;
          return;
        }
        // Группировка выбранных тем по блоку (поле block из БД)
        const groups = {};
        S.topics.slice(0, 20).forEach((t) => {
          const g = (t.block || "").trim() || "Темы";
          (groups[g] = groups[g] || []).push(t);
        });
        Object.keys(groups).forEach((g) => {
          const header = document.createElement("div");
          header.className = "block-header";
          header.textContent = "📚 " + g;
          wrap.appendChild(header);
          groups[g].forEach((t) => wrap.appendChild(topicCard(t)));
        });
      }
      function topicCard(t) {
        const card = document.createElement("div");
        card.className = "card";
        const plat = S.platform[t.id] || "habr";
        const hasPlans = S.plansByTopic[t.id];
        const srcCount =
          Number(t.source_count) || (t.sources || []).length || 0;
        card.innerHTML = `
          <div class="badge">🗞 ${srcCount} источн.</div>
          <div class="badge">📅 ${fmtDt(t.date)}</div>
          ${t.description ? `<div class="t-reason">📝 ${esc(t.description)}</div>` : ""}
          <div class="t-title">${esc(t.title)}</div>
          <div class="t-actions">
            <select class="plat-select" data-topic="${t.id}" title="Платформа для стиля статьи">
              ${S.platforms.map((p) => `<option value="${esc(p.key)}" ${p.key === plat ? "selected" : ""}>${esc(p.name)}</option>`).join("")}
            </select>
            <button class="btn small" data-act="plans" data-id="${t.id}">🎯 Сгенерировать план</button>
          </div>
          <div class="plans" id="plans-${t.id}"></div>

      async function onPlans(topicId) {
        const plat = document.querySelector(
          `.plat-select[data-topic="${topicId}"]`,
        ).value;
        S.platform[topicId] = plat;
        const box = $("plans-" + topicId);
        box.innerHTML = `<p class="hint"><span class="loader"></span>Генерация планов… (30–90 сек)</p>`;
        try {
          const data = await api(`/api/topics/${topicId}/plans`, {
            method: "POST",
            body: { platform: plat },
          });
          S.plansByTopic[topicId] = {
            plan: data.plan,
            platform: data.platform,
            platform_name: data.platform_name,
            style: data.style,
            tone: data.tone || "",
            max_product_mention: data.max_product_mention || "",
          };
          renderPlans(topicId, S.plansByTopic[topicId]);

          box.innerHTML = `<p class="error">${esc(e.message)}</p>`;

      function pointRow(value) {
        const row = document.createElement("div");
        row.className = "point-row";
        row.innerHTML = `
          <textarea class="plan-point" rows="2" placeholder="Пункт плана…">${esc(value)}</textarea>

          .querySelector('[data-act="del-point"]')

      }
      function sectionBlock(s) {
        s = s || {};
        const div = document.createElement("div");
        div.className = "plan-section";
        div.innerHTML = `
          <div class="sec-head">
            <span class="sec-num">H2</span>
            <input type="text" class="sec-heading" value="${esc(s.heading || "")}" placeholder="Заголовок раздела (H2)…">
            <button class="btn small" data-act="del-section" title="Удалить раздел">➖ Удалить</button>
          </div>
          <label class="plan-lbl">Цель раздела
            <textarea class="sec-purpose" rows="2" placeholder="Зачем нужен этот раздел в статье…">${esc(s.purpose || "")}</textarea>
          </label>
          <label class="plan-lbl">Ключевые тезисы (3–5)</label>
          <div class="sec-points"></div>
          <div class="t-actions" style="margin-top:6px">
            <button class="btn small" data-act="add-point">➕ Тезис</button>
          </div>
          <div class="sec-meta">
            <label class="plan-lbl">Тип контента
              <input type="text" class="sec-type" value="${esc(s.content_type || "")}" placeholder="цифры / кейс / код / сравнение…">
            </label>
            <label class="plan-lbl">Объём (абзацы)
              <input type="text" class="sec-len" value="${esc(s.estimated_length || "")}" placeholder="например, 3–4 абзаца">
            </label>
          </div>
          <label class="plan-lbl">Связь с продуктом (мессенджером)
            <textarea class="sec-product" rows="2" placeholder="Как показать ценность: интеграция, безопасность, скорость, API, автоматизация…">${esc(s.product_link || "")}</textarea>
          </label>

        const ptsBox = div.querySelector(".sec-points");
        const pts =
          Array.isArray(s.points) && s.points.length ? s.points : [""];
        pts.forEach((pt) => ptsBox.appendChild(pointRow(pt)));
        div
          .querySelector('[data-act="add-point"]')
          .addEventListener("click", () => ptsBox.appendChild(pointRow("")));
        div
          .querySelector('[data-act="del-section"]')
          .addEventListener("click", () => div.remove());
        return div;
      }
      function objectionBlock(o) {
        o = o || {};
        const div = document.createElement("div");
        div.className = "obj-row";
        div.innerHTML = `
          <div class="obj-fields">
            <label class="plan-lbl">Возражение аудитории
              <textarea class="obj-text" rows="2" placeholder="Например: боятся утечки данных…">${esc(o.objection || "")}</textarea>
            </label>
            <label class="plan-lbl">Как закрыто в статье
              <textarea class="obj-counter" rows="2" placeholder="Контр-аргумент…">${esc(o.counter || "")}</textarea>
            </label>
          </div>
          <button class="btn small" data-act="del-objection" title="Удалить возражение">➖ Удалить</button>
        `;
        div
          .querySelector('[data-act="del-objection"]')
          .addEventListener("click", () => div.remove());
        return div;
      }
      function renderPlans(topicId, store) {
        const box = $("plans-" + topicId);
        const plan = (store && store.plan) || {};
        const tone = (store && store.tone) || "";
        const maxMention = (store && store.max_product_mention) || "";
        box.innerHTML = `<div class="hint" style="margin-bottom:6px">Платформа: <b>${esc(store.platform_name)}</b> · ${esc(store.style)}</div>`;
        const div = document.createElement("div");
        div.className = "plan";
        div.dataset.topic = topicId;
        div.innerHTML = `
          <h4>
            <span>📌 План статьи</span>
            ${store.platform_name ? `<span class="badge plat">🏷 ${esc(store.platform_name)}</span>` : ""}
          </h4>
          <label class="plan-lbl">Заголовок плана
            <input type="text" class="plan-title" value="${esc(plan.title || "")}" placeholder="Заголовок статьи…">
          </label>
          <label class="plan-lbl">Краткое описание (для читателя)
            <textarea class="plan-summary" rows="2" placeholder="О чём статья, для кого, какой результат получит читатель…">${esc(plan.summary || "")}</textarea>
          </label>
          <label class="plan-lbl">Целевая метрика конверсии
            <textarea class="plan-conversion" rows="2" placeholder="Регистрация / запрос демо / отклик на вакансию и где это предложено в CTA…">${esc(plan.conversion_goal || "")}</textarea>
          </label>
          ${
            tone || maxMention
              ? `
          <div class="plan-hints">
            ${tone ? `<span class="hint-chip">🎯 Тон: ${esc(tone)}</span>` : ""}
            ${maxMention ? `<span class="hint-chip">🔢 Лимит упоминания продукта: ${esc(maxMention)}</span>` : ""}
          </div>`
              : ""
          }
          <div class="plan-sub">📐 Разделы</div>
          <div class="plan-sections"></div>
          <div class="plan-sub">🛡 Риски и возражения</div>
          <div class="plan-objections"></div>
          <div class="t-actions" style="margin-top:12px">
            <button class="btn small" data-act="add-section">➕ Добавить раздел</button>
            <button class="btn small" data-act="add-objection">➕ Добавить возражение</button>
            <button class="btn small primary" data-act="art">✍️ Отправить на генерацию статьи</button>
          </div>
          <div class="art-box" id="art-${topicId}"></div>
        `;
        const sectionsBox = div.querySelector(".plan-sections");
        const objectionsBox = div.querySelector(".plan-objections");
        (Array.isArray(plan.sections) ? plan.sections : []).forEach((s) =>
          sectionsBox.appendChild(sectionBlock(s)),
        );
        (Array.isArray(plan.objections) ? plan.objections : []).forEach((o) =>
          objectionsBox.appendChild(objectionBlock(o)),
        );
        div
          .querySelector('[data-act="add-section"]')
          .addEventListener("click", () =>
            sectionsBox.appendChild(sectionBlock({})),
          );
        div
          .querySelector('[data-act="add-objection"]')
          .addEventListener("click", () =>
            objectionsBox.appendChild(objectionBlock({})),
          );
        div
          .querySelector('[data-act="art"]')
          .addEventListener("click", () => onArticle(topicId));
        box.appendChild(div);
      }
      function secVal(root, sel) {
        const el = root.querySelector(sel);
        return el ? el.value.trim() : "";
      }
      function collectPlan(div) {
        const val = (sel) => {
          const el = div.querySelector(sel);
          return el ? el.value.trim() : "";
        };
        const plan = {
          title: val(".plan-title"),
          summary: val(".plan-summary"),
          conversion_goal: val(".plan-conversion"),
          sections: [],
          objections: [],
        };
        div.querySelectorAll(".plan-section").forEach((sec) => {
          const section = {
            heading: secVal(sec, ".sec-heading"),
            purpose: secVal(sec, ".sec-purpose"),
            points: Array.from(sec.querySelectorAll(".plan-point"))
              .map((ta) => ta.value.trim())
              .filter((s) => s.length > 0),
            content_type: secVal(sec, ".sec-type"),
            estimated_length: secVal(sec, ".sec-len"),
            product_link: secVal(sec, ".sec-product"),
          };
          // Полностью пустые разделы (нет заголовка, цели, тезисов и связей) отбрасываем
          if (
            section.heading ||
            section.purpose ||
            section.points.length ||
            section.content_type ||
            section.estimated_length ||
            section.product_link
          ) {
            plan.sections.push(section);
          }
        });
        div.querySelectorAll(".obj-row").forEach((o) => {
          const objection = {
            objection: secVal(o, ".obj-text"),
            counter: secVal(o, ".obj-counter"),
          };
          // Пустые возражения (оба поля пусты) отбрасываем
          if (objection.objection || objection.counter) {
            plan.objections.push(objection);
          }
        });
        return plan;
      }

      // ---------- Статьи ----------
      async function onArticle(topicId) {
        const div = document.querySelector(`.plan[data-topic="${topicId}"]`);
        const plat = S.platform[topicId] || "habr";
        const box = $("art-" + topicId);
        const plan = collectPlan(div);
        if (!plan.title) {
          toast("Укажи заголовок плана перед генерацией статьи.", "err");
          return;
        }
        if (!plan.sections.length) {
          toast("План пуст: добавь хотя бы один заполненный раздел.", "err");
          return;
        }
        const topic = (S.topics || []).find(
          (t) => String(t.id) === String(topicId),
        );
        box.innerHTML = `<p class="hint"><span class="loader"></span>Генерация статьи… (1–3 мин)</p>`;
        try {
          const data = await api("/api/articles/generate-v2", {
            method: "POST",
            body: {
              topic_id: topicId,
              platform: plat,
              plan_title: plan.title,
              plan_summary: plan.summary,
              plan_sections: plan.sections,
              plan_objections: plan.objections,
              plan_sources: Array.isArray(topic && topic.sources)
                ? topic.sources
                : [],
            },
          });
          box.innerHTML = "";
          prependArticle(data);
          await loadArticles();
        } catch (e) {
          box.innerHTML = `<p class="error">${esc(e.message)}</p>`;
        }
      }
      function prependArticle(a) {
        const wrap = $("articles");
        if (!wrap.querySelector(`[data-art-id="${a.id}"]`)) {
          wrap.prepend(articleCard(a));
        }
        $("articles-count").textContent = "(" + wrap.children.length + ")";
      }
      function expertRecClass(rec) {
        const r = String(rec || "").toLowerCase();
        if (r.includes("готов")) return "expert-rec ok";
        if (r.includes("доработ")) return "expert-rec warn";
        return "expert-rec";
      }
      function articleCard(a) {
        const div = document.createElement("div");
        div.className = "card";
        div.dataset.artId = a.id;
        const expert = !!(a.final_content && a.expert_report);
        const body = expert ? a.final_content : a.article || "";
        const bodyHtml = renderMarkdown(body);
        const platName = a.platform_name || a.platform || "";
        div.innerHTML = `
          <div class="badge">${a.status === "published" ? "✅ опубликована" : a.status === "expertised" ? "🧪 проверена" : "📝 черновик"}</div>
          <div class="t-title">
            ${platName ? `<span class="badge plat">🏷 ${esc(platName)}</span>` : ""}
            ${esc(a.plan_title || a.topic_title || "Статья")}
          </div>
          ${
            expert
              ? `
          <div class="expert-block">
            <div class="expert-head">
              <span class="expert-rating">⭐ Рейтинг: ${a.expert_rating}/10</span>
              <span class="${expertRecClass(a.expert_recommendation)}">${esc(a.expert_recommendation)}</span>
            </div>
            <details>
              <summary>📋 Отчёт экспертизы</summary>
              <div class="factcheck">${esc(a.expert_report)}</div>
            </details>
          </div>`
              : ""
          }
          <div class="article-content article-body">${bodyHtml}</div>
          <div class="art-actions">
            ${
              expert
                ? `<button class="btn small primary" data-act="copy-final">📋 Копировать финальный текст</button>`
                : `<button class="btn small green" data-act="expert" data-id="${a.id}">🔍 Отправить на экспертизу</button>`
            }
          </div>
        `;
        const expBtn = div.querySelector('[data-act="expert"]');
        if (expBtn) {
          expBtn.addEventListener("click", () => onExpertise(a.id, div));
        }
        const copyFinal = div.querySelector('[data-act="copy-final"]');
        if (copyFinal) {
          copyFinal.addEventListener("click", async () => {
            // Копируем ИСХОДНЫЙ Markdown, а не HTML из marked.parse()
            const textToCopy = (a.final_content || a.article || "").trim();
            if (!textToCopy) {
              console.error("Текст для копирования не найден");
              toast("Нет текста для копирования", "err");
              return;
            }
            try {
              if (
                !navigator.clipboard ||
                typeof navigator.clipboard.writeText !== "function"
              ) {
                throw new Error("Clipboard API недоступен");
              }
              await navigator.clipboard.writeText(textToCopy);
              toast("Финальный текст скопирован", "ok");
            } catch (err) {
              console.error("Ошибка при копировании текста", err);
              // Fallback для старых браузеров / небезопасного контекста
              try {
                const textarea = document.createElement("textarea");
                textarea.value = textToCopy;
                textarea.style.position = "fixed";
                textarea.style.opacity = "0";
                document.body.appendChild(textarea);
                textarea.select();
                const ok = document.execCommand("copy");
                document.body.removeChild(textarea);
                if (ok) {
                  toast("Финальный текст скопирован (fallback)", "ok");
                } else {
                  throw new Error("execCommand('copy') вернул false");
                }
              } catch (err2) {
                console.error("Не удалось скопировать текст", err2);
                toast(
                  "Не удалось скопировать текст: " +
                    (err2 && err2.message ? err2.message : String(err2)),
                  "err",
                );
              }
            }
          });
        }
        return div;
      }
      async function onExpertise(articleId, card) {
        const btn = card.querySelector('[data-act="expert"]');
        if (!btn) return;
        const oldHtml = btn.innerHTML;
        btn.disabled = true;
        btn.innerHTML = '<span class="loader"></span> Экспертиза…';
        try {
          const data = await api(`/api/articles/${articleId}/expertise`, {
            method: "POST",
          });
          const idx = S.articles.findIndex((x) => x.id === articleId);
          const old = idx !== -1 ? S.articles[idx] : {};
          const merged = {
            ...old,
            article: data.final_text || old.article,
            final_content: data.final_text,
            expert_report: data.report,
            expert_rating: data.rating,
            expert_recommendation: data.recommendation,
            status: "expertised",
          };
          if (idx !== -1) S.articles[idx] = merged;
          card.replaceWith(articleCard(merged));
          toast("Экспертиза завершена: рейтинг " + data.rating + "/10", "ok");
        } catch (e) {
          toast(e.message, "err");
          btn.disabled = false;
          btn.innerHTML = oldHtml;
        }
      }
      async function loadArticles() {
        const data = await api("/api/articles");
        S.articles = data.articles;
        $("articles-count").textContent = "(" + S.articles.length + ")";
        const wrap = $("articles");
        wrap.innerHTML = "";
        if (!S.articles.length) {
          wrap.innerHTML = `<p class="empty">Статей пока нет. Выбери тему → «Сгенерировать план» → отредактируй → «Отправить на генерацию статьи».</p>`;
          return;
        }
        S.articles.forEach((a) => wrap.appendChild(articleCard(a)));
        renderStats();
      }

      // ---------- Инициализация ----------
      async function init() {
        $("btn-collect").addEventListener("click", onCollect);
        $("btn-select").addEventListener("click", onSelect);
        $("btn-refresh").addEventListener("click", refreshAll);
        $("btn-save-schedule").addEventListener("click", onSaveSchedule);
        await loadSchedule();
        await refreshAll();
      }
      async function refreshAll() {
        $("btn-refresh").disabled = true;
        try {
          await Promise.allSettled([
            loadStatus(),
            loadPlatforms(),
            loadTopics(),
            loadArticles(),
          ]);
        } finally {
          $("btn-refresh").disabled = false;
        }
      }
      async function loadPlatforms() {
        const data = await api("/api/platforms");
        S.platforms = data.platforms;
      }
      init();
    </script>
  </body>
</html>
