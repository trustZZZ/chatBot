<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trend Scanner — Веб-панель</title>
    <style>
      :root {
        --bg: #0d1117;
        --panel: #161b22;
        --panel2: #1c2128;
        --border: #30363d;
        --text: #e6edf3;
        --muted: #8b949e;
        --accent: #58a6ff;
        --green: #3fb950;
        --yellow: #d29922;
        --red: #f85149;
        --purple: #bc8cff;
        --radius: 10px;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font-family:
          -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        line-height: 1.55;
        min-height: 100vh;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
        padding: 18px 24px;
        border-bottom: 1px solid var(--border);
        background: var(--panel);
        position: sticky;
        top: 0;
        z-index: 20;
      }
      header h1 {
        font-size: 20px;
        letter-spacing: 0.3px;
      }
      header .sub {
        color: var(--muted);
        font-size: 12px;
        margin-top: 2px;
      }
      .chips {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .chip {
        font-size: 12px;
        padding: 4px 10px;
        border-radius: 20px;
        border: 1px solid var(--border);
        background: var(--panel2);
        color: var(--muted);
        white-space: nowrap;
      }
      .chip.ok {
        color: var(--green);
        border-color: rgba(63, 185, 80, 0.4);
      }
      .chip.warn {
        color: var(--yellow);
        border-color: rgba(210, 153, 34, 0.4);
      }
      .chip.err {
        color: var(--red);
        border-color: rgba(248, 81, 73, 0.4);
      }
      main {
        max-width: 1100px;
        margin: 0 auto;
        padding: 24px;
      }
      section {
        margin-bottom: 32px;
      }
      h2 {
        font-size: 16px;
        margin-bottom: 12px;
        color: var(--text);
        display: flex;
        align-items: center;
        gap: 8px;
      }
      h2 .count {
        color: var(--muted);
        font-weight: 400;
        font-size: 13px;
      }
      .toolbar {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-bottom: 16px;
      }
      .btn {
        background: var(--panel2);
        color: var(--text);
        border: 1px solid var(--border);
        padding: 9px 16px;
        border-radius: var(--radius);
        font-size: 14px;
        cursor: pointer;
        transition:
          background 0.15s,
          border-color 0.15s,
          opacity 0.15s;
      }
      .btn:hover:not(:disabled) {
        background: #21262d;
        border-color: var(--accent);
      }
      .btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .btn.primary {
        background: linear-gradient(135deg, #1f6feb, #388bfd);
        border-color: #1f6feb;
        color: #fff;
      }
      .btn.primary:hover:not(:disabled) {
        filter: brightness(1.1);
      }
      .btn.green {
        background: linear-gradient(135deg, #238636, #2ea043);
        border-color: #238636;
        color: #fff;
      }
      .btn.small {
        padding: 5px 10px;
        font-size: 12px;
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 10px;
        margin-bottom: 24px;
      }
      .stat {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 14px 16px;
      }
      .stat .num {
        font-size: 26px;
        font-weight: 700;
        color: var(--accent);
      }
      .stat .lbl {
        font-size: 12px;
        color: var(--muted);
        margin-top: 2px;
      }
      .card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 16px;
        margin-bottom: 12px;
      }
      .empty {
        color: var(--muted);
        font-size: 14px;
        padding: 12px 0;
      }
      .badge {
        display: inline-block;
        font-size: 11px;
        padding: 2px 8px;
        border-radius: 12px;
        background: var(--panel2);
        border: 1px solid var(--border);
        color: var(--muted);
        margin-right: 6px;
      }
      .badge.score {
        color: var(--yellow);
      }
      .t-title {
        font-size: 15px;
        font-weight: 600;
        margin: 8px 0;
      }
      .t-reason {
        font-size: 13px;
        color: var(--muted);
        background: var(--panel2);
        border-left: 3px solid var(--accent);
        padding: 8px 10px;
        border-radius: 4px;
        margin: 8px 0;
      }
      .t-actions {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }
      select,
      input,
      textarea {
        background: var(--panel2);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 8px 10px;
        font-size: 14px;
        font-family: inherit;
        outline: none;
      }
      select:focus,
      input:focus,
      textarea:focus {
        border-color: var(--accent);
      }
      .plans {
        margin-top: 12px;
        display: grid;
        gap: 10px;
      }
      .plan {
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 12px 14px;
        background: var(--panel2);
      }
      .plan h4 {
        font-size: 14px;
        margin-bottom: 6px;
        display: flex;
        justify-content: space-between;
        gap: 8px;
        align-items: center;
      }
      .plan ul {
        margin: 6px 0 10px 20px;
        font-size: 13px;
        color: var(--muted);
      }
      .plan li {
        margin-bottom: 2px;
      }
      .plan-lbl {
        display: block;
        font-size: 12px;
        color: var(--muted);
        margin: 10px 0 4px;
      }
      .plan-lbl input {
        display: block;
        width: 100%;
        margin-top: 4px;
      }
      .point-row {
        display: flex;
        gap: 8px;
        align-items: flex-start;
        margin-bottom: 8px;
      }
      .point-row textarea {
        flex: 1;
        resize: vertical;
        min-height: 44px;
      }
      .point-row .btn {
        white-space: nowrap;
        margin-top: 2px;
      }
      .hint {
        font-size: 12px;
        color: var(--muted);
        margin-top: 8px;
      }
      .error {
        color: var(--red);
        font-size: 13px;
        margin-top: 8px;
      }
      .loader {
        display: inline-block;
        width: 16px;
        height: 16px;
        border: 2px solid var(--border);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        vertical-align: middle;
        margin-right: 8px;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      details {
        border: 1px solid var(--border);
        border-radius: var(--radius);
        margin-bottom: 8px;
        background: var(--panel2);
      }
      summary {
        cursor: pointer;
        padding: 10px 14px;
        font-size: 13px;
        color: var(--muted);
        user-select: none;
      }
      .article-body {
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 16px 18px;
        margin: 10px 0;
        background: #fff;
        color: #1f2328;
        font-size: 15px;
      }
      .article-body h2 {
        color: #1f2328;
        font-size: 20px;
        margin: 16px 0 8px;
        display: block;
      }
      .article-body h3 {
        color: #1f2328;
        font-size: 17px;
        margin: 12px 0 6px;
      }
      .article-body p {
        margin: 8px 0;
      }
      .article-body a {
        color: #0969da;
        text-decoration: none;
      }
      .article-body a:hover {
        text-decoration: underline;
      }
      .article-body ul,
      .article-body ol {
        margin: 8px 0 8px 22px;
      }
      .article-body li {
        margin: 4px 0;
      }
      .article-body strong {
        font-weight: 700;
      }
      .factcheck {
        white-space: pre-wrap;
        font-size: 13px;
        color: var(--text);
        padding: 12px 14px;
        line-height: 1.6;
      }
      .art-actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .url-link {
        color: var(--green);
        word-break: break-all;
      }
      footer {
        padding: 20px 24px;
        border-top: 1px solid var(--border);
        color: var(--muted);
        font-size: 12px;
        text-align: center;
      }
      #toast {
        position: fixed;
        right: 20px;
        bottom: 20px;
        z-index: 100;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .toast-item {
        background: var(--panel2);
        border: 1px solid var(--border);
        border-left: 4px solid var(--accent);
        padding: 10px 14px;
        border-radius: 8px;
        font-size: 13px;
        max-width: 380px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
        animation: fadein 0.2s ease;
      }
      .toast-item.ok {
        border-left-color: var(--green);
      }
      .toast-item.err {
        border-left-color: var(--red);
      }
      @keyframes fadein {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @media (max-width: 640px) {
        main {
          padding: 16px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div>
        <h1>📡 Trend Scanner</h1>
        <div class="sub">Сбор трендов · генерация статей · публикация</div>
      </div>
      <div class="chips" id="status-chips">
        <span class="chip">загрузка…</span>
      </div>
    </header>

    <main>
      <section>
        <div class="toolbar">
          <button class="btn primary" id="btn-collect">
            🔄 Собрать тренды
          </button>
          <button class="btn" id="btn-refresh">🗂 Обновить списки</button>
        </div>
        <div class="stats" id="stats"></div>
      </section>

      <section id="found-section" hidden>
        <h2>🌐 Найденные темы <span class="count" id="found-count"></span></h2>
        <div class="toolbar">
          <button class="btn green" id="btn-select" disabled>
            ✅ Выбрать отмеченные
          </button>
          <span class="hint" id="found-hint"></span>
        </div>
        <div id="found-topics"></div>
      </section>

      <section>
        <h2>📰 Темы дня <span class="count" id="topics-count"></span></h2>
        <div id="topics"></div>
      </section>

      <section>
        <h2>📄 Статьи <span class="count" id="articles-count"></span></h2>
        <div id="articles"></div>
      </section>
    </main>

    <footer>
      Trend Scanner · веб-панель без Telegram-бота · LLM:
      <span id="llm-model">—</span>
    </footer>
    <div id="toast"></div>

    <script>
      "use strict";

      const $ = (id) => document.getElementById(id);
      const S = {
        foundTopics: [], // темы из последнего сбора («Найденные темы»)
        checked: new Set(), // индексы отмеченных тем в «Найденные темы»
        topics: [], // выбранные темы в БД («Темы дня»)
        platform: {}, // topic_id -> выбранная платформа
        plansByTopic: {}, // topic_id -> {plans, platform_name, style}
        articles: [],
        platforms: [],
      };

      // ---------- Утилиты ----------
      function esc(s) {
        const AMP = String.fromCharCode(38);
        const ent = (c) => AMP + "#" + c.charCodeAt(0) + ";";
        return String(s ?? "").replace(/[&<>"']/g, ent);
      }
      function stripHtml(h) {
        const d = document.createElement("div");
        d.innerHTML = h || "";
        return d.textContent || "";
      }
      function fmtDt(iso) {
        if (!iso) return "—";
        const d = new Date(iso);
        return d.toLocaleString("ru-RU", {
          day: "2-digit",
          month: "2-digit",
          hour: "2-digit",
          minute: "2-digit",
        });
      }
      function toast(msg, type) {
        const el = document.createElement("div");
        el.className = "toast-item " + (type || "");
        el.textContent = msg;
        $("toast").appendChild(el);
        setTimeout(() => el.remove(), 5000);
      }
      async function api(path, opts) {
        const init = { headers: { "Content-Type": "application/json" } };
        if (opts?.method) init.method = opts.method;
        if (opts?.body) init.body = JSON.stringify(opts.body);
        const r = await fetch(path, init);
        let data = null;
        try {
          data = await r.json();
        } catch (_) {}
        if (!r.ok) {
          const msg =
            data && data.detail
              ? typeof data.detail === "string"
                ? data.detail
                : JSON.stringify(data.detail)
              : "HTTP " + r.status;
          throw new Error(msg);
        }
        return data;
      }
      async function busy(btn, fn) {
        const old = btn.innerHTML,
          was = btn.disabled;
        btn.disabled = true;
        btn.innerHTML = '<span class="loader"></span>…';
        try {
          await fn();
        } catch (e) {
          console.error(e);
          toast(e.message, "err");
        } finally {
          btn.disabled = was;
          btn.innerHTML = old;
        }
      }

      // ---------- Статус и статистика ----------
      let STATUS = null;
      async function loadStatus() {
        try {
          STATUS = await api("/api/status");
          const chips = $("status-chips");
          chips.innerHTML = "";
          const st = STATUS.state || {};
          const sched = STATUS.scheduler_running
            ? `<span class="chip ok">⏰ Автосбор ${esc(STATUS.trends_time)} МСК · след. ${fmtDt(STATUS.next_daily_run)}</span>`
            : `<span class="chip warn">⏰ Планировщик выключен</span>`;
          const llm = STATUS.llm_configured
            ? `<span class="chip ok">🧠 LLM: ${esc(STATUS.llm_model)}</span>`
            : `<span class="chip err">🧠 LLM не настроен</span>`;
          const prx = STATUS.proxy
            ? `<span class="chip">🛰 Прокси: ${esc(STATUS.proxy)}</span>`
            : `<span class="chip">🛰 Прямое подключение</span>`;
          chips.innerHTML = sched + llm + prx;
          $("llm-model").textContent = STATUS.llm_model || "—";
          renderStats();
        } catch (e) {
          toast("Не удалось получить статус: " + e.message, "err");
        }
      }
      function renderStats() {
        const st = STATUS?.state || {};
        const nums = [
          {
            n: st.last_collect_count || 0,
            l: "Найдено тем",
            t: st.last_collect ? fmtDt(st.last_collect) : "",
          },
          { n: S.topics.length, l: "Тем в БД" },
          { n: S.articles.length, l: "Статей" },
          {
            n: st.last_daily ? "✓" : "—",
            l: "Последний автосбор",
            t: st.last_daily ? fmtDt(st.last_daily) : "",
          },
        ];
        $("stats").innerHTML = nums
          .map(
            (x) =>
              `<div class="stat"><div class="num">${esc(x.n)}</div><div class="lbl">${esc(x.l)}</div>` +
              (x.t ? `<div class="lbl">${esc(x.t)}</div>` : "") +
              `</div>`,
          )
          .join("");
      }

      // ---------- Сбор трендов → найденные темы ----------
      async function onCollect() {
        await busy($("btn-collect"), async () => {
          const data = await api("/api/trends/collect", { method: "POST" });
          S.foundTopics = data.topics || [];
          S.checked.clear();
          renderFound();
          await loadStatus();
          toast(`Найдено тем: ${data.count}`, "ok");
        });
      }
      function renderFound() {
        const sec = $("found-section");
        sec.hidden = !S.foundTopics.length;
        $("found-count").textContent = "(" + S.foundTopics.length + ")";
        $("found-hint").textContent = S.foundTopics.length
          ? "Отметь темы, которые хочешь развить в статью."
          : "";
        const wrap = $("found-topics");
        wrap.innerHTML = "";
        S.foundTopics.forEach((t, idx) =>
          wrap.appendChild(foundTopicCard(t, idx)),
        );
        updateSelectBtn();
      }
      function foundTopicCard(t, idx) {
        const card = document.createElement("div");
        card.className = "card";
        const sources = t.sources || [];
        const srcCount = Number(t.source_count) || sources.length || 0;
        card.innerHTML = `
          <label style="display:flex; gap:12px; align-items:flex-start; cursor:pointer">
            <input type="checkbox" class="found-check" data-idx="${idx}"
                   style="width:17px; height:17px; margin-top:3px; accent-color:var(--green)">
            <div style="flex:1">
              <div class="t-title" style="margin-top:0">${esc(t.topic)}</div>
              ${t.description ? `<div class="t-reason">📝 ${esc(t.description)}</div>` : ""}
              <div class="hint">🗞 Источников: <b>${srcCount}</b></div>
              ${
                sources.length
                  ? `<details><summary>🔗 Источники (${sources.length})</summary>
                      <ul style="margin:8px 0 0 20px; font-size:13px">
                        ${sources.map((u) => `<li><a href="${esc(u)}" target="_blank" rel="noopener" style="color:var(--accent); word-break:break-all">${esc(u)}</a></li>`).join("")}
                      </ul>
                     </details>`
                  : ""
              }
            </div>
          </label>
        `;
        const chk = card.querySelector(".found-check");
        chk.checked = S.checked.has(idx);
        chk.addEventListener("change", () => {
          if (chk.checked) S.checked.add(idx);
          else S.checked.delete(idx);
          updateSelectBtn();
        });
        return card;
      }
      function updateSelectBtn() {
        $("btn-select").disabled = S.checked.size === 0;
      }
      async function onSelect() {
        await busy($("btn-select"), async () => {
          const selected = S.foundTopics
            .filter((_, idx) => S.checked.has(idx))
            .map((t) => ({
              topic: t.topic,
              description: t.description,
              sources: t.sources || [],
              source_count:
                Number(t.source_count) || (t.sources || []).length || 0,
            }));
          if (!selected.length) throw new Error("Отметь хотя бы одну тему.");
          const data = await api("/api/topics/select", {
            method: "POST",
            body: { topics: selected },
          });
          S.checked.clear();
          renderFound();
          await loadTopics();
          toast(`Сохранено тем в «Темы дня»: ${data.saved}`, "ok");
        });
      }

      // ---------- Темы дня ----------
      async function loadTopics() {
        const data = await api("/api/topics");
        S.topics = data.topics;
        renderTopics();
        renderStats();
      }
      function renderTopics() {
        $("topics-count").textContent = "(" + S.topics.length + ")";
        const wrap = $("topics");
        wrap.innerHTML = "";
        if (!S.topics.length) {
          wrap.innerHTML = `<p class="empty">Пока нет тем. Собери тренды и отметь понравившиеся темы в «🌐 Найденные темы».</p>`;
          return;
        }
        S.topics.slice(0, 20).forEach((t) => wrap.appendChild(topicCard(t)));
      }
      function topicCard(t) {
        const card = document.createElement("div");
        card.className = "card";
        const plat = S.platform[t.id] || "habr";
        const hasPlans = S.plansByTopic[t.id];
        const srcCount =
          Number(t.source_count) || (t.sources || []).length || 0;
        card.innerHTML = `
          <div class="badge">🗞 ${srcCount} источн.</div>
          <div class="badge">📅 ${fmtDt(t.date)}</div>
          ${t.description ? `<div class="t-reason">📝 ${esc(t.description)}</div>` : ""}
          <div class="t-title">${esc(t.title)}</div>
          <div class="t-actions">
            <select class="plat-select" data-topic="${t.id}" title="Платформа для стиля статьи">
              ${S.platforms.map((p) => `<option value="${esc(p.key)}" ${p.key === plat ? "selected" : ""}>${esc(p.name)}</option>`).join("")}
            </select>
            <button class="btn small" data-act="plans" data-id="${t.id}">🎯 Сгенерировать план</button>
          </div>
          <div class="plans" id="plans-${t.id}"></div>
        `;
        card
          .querySelector('[data-act="plans"]')
          .addEventListener("click", () => onPlans(t.id));
        if (hasPlans) renderPlans(t.id, hasPlans);
        return card;
      }
      async function onPlans(topicId) {
        const plat = document.querySelector(
          `.plat-select[data-topic="${topicId}"]`,
        ).value;
        S.platform[topicId] = plat;
        const box = $("plans-" + topicId);
        box.innerHTML = `<p class="hint"><span class="loader"></span>Генерация планов… (30–90 сек)</p>`;
        try {
          const data = await api(`/api/topics/${topicId}/plans`, {
            method: "POST",
            body: { platform: plat },
          });
          S.plansByTopic[topicId] = {
            plans: data.plans,
            platform_name: data.platform_name,
            style: data.style,
          };
          renderPlans(topicId, S.plansByTopic[topicId]);
        } catch (e) {
          box.innerHTML = `<p class="error">${esc(e.message)}</p>`;
        }
      }
      function pointRow(value) {
        const row = document.createElement("div");
        row.className = "point-row";
        row.innerHTML = `
          <textarea class="plan-point" rows="2" placeholder="Пункт плана…">${esc(value)}</textarea>
          <button class="btn small" data-act="del-point" title="Удалить пункт">➖ Удалить</button>
        `;
        row
          .querySelector('[data-act="del-point"]')
          .addEventListener("click", () => row.remove());
        return row;
      }
      function renderPlans(topicId, store) {
        const box = $("plans-" + topicId);
        box.innerHTML = `<div class="hint" style="margin-bottom:6px">Платформа: <b>${esc(store.platform_name)}</b> · ${esc(store.style)}</div>`;
        store.plans.forEach((p, i) => {
          const div = document.createElement("div");
          div.className = "plan";
          div.dataset.topic = topicId;
          div.dataset.idx = i;
          div.innerHTML = `
            <h4><span>📌 План ${esc(p.variant)}</span></h4>
            <label class="plan-lbl">Заголовок плана
              <input type="text" class="plan-title" value="${esc(p.title)}" placeholder="Заголовок статьи…">
            </label>
            <div class="plan-points"></div>
            <div class="t-actions" style="margin-top:10px">
              <button class="btn small" data-act="add-point">➕ Добавить пункт</button>
              <button class="btn small primary" data-act="art">✍️ Отправить на генерацию статьи</button>
            </div>
            <div class="art-box" id="art-${topicId}-${i}"></div>
          `;
          const pointsBox = div.querySelector(".plan-points");
          (p.points || []).forEach((pt) => pointsBox.appendChild(pointRow(pt)));
          div
            .querySelector('[data-act="add-point"]')
            .addEventListener("click", () =>
              pointsBox.appendChild(pointRow("")),
            );
          div
            .querySelector('[data-act="art"]')
            .addEventListener("click", () => onArticle(topicId, i));
          box.appendChild(div);
        });
      }

      // ---------- Статьи ----------
      async function onArticle(topicId, planIdx) {
        const div = document.querySelector(
          `.plan[data-topic="${topicId}"][data-idx="${planIdx}"]`,
        );
        const plat = S.platform[topicId] || "habr";
        const box = $("art-" + topicId + "-" + planIdx);
        const planTitle =
          div.querySelector(".plan-title").value.trim() || "Статья";
        const planPoints = Array.from(div.querySelectorAll(".plan-point"))
          .map((ta) => ta.value.trim())
          .filter((s) => s.length > 0);
        if (!planPoints.length) {
          toast("Добавь хотя бы один пункт плана.", "err");
          return;
        }
        box.innerHTML = `<p class="hint"><span class="loader"></span>Генерация статьи + фактчекинг… (1–3 мин)</p>`;
        try {
          const data = await api("/api/articles/generate-v2", {
            method: "POST",
            body: {
              topic_id: topicId,
              platform: plat,
              plan_title: planTitle,
              plan_points: planPoints,
            },
          });
          box.innerHTML = "";
          prependArticle(data);
          await loadArticles();
        } catch (e) {
          box.innerHTML = `<p class="error">${esc(e.message)}</p>`;
        }
      }
      function prependArticle(a) {
        const wrap = $("articles");
        if (!wrap.querySelector(`[data-art-id="${a.id}"]`)) {
          wrap.prepend(articleCard(a));
        }
        $("articles-count").textContent = "(" + wrap.children.length + ")";
      }
      function articleCard(a) {
        const div = document.createElement("div");
        div.className = "card";
        div.dataset.artId = a.id;
        const url = a.published_url || "";
        div.innerHTML = `
          <div class="badge">${esc(a.platform_name || a.platform || "")}</div>
          <div class="badge">${a.status === "published" ? "✅ опубликована" : "📝 черновик"}</div>
          <div class="t-title">${esc(a.plan_title || a.topic_title || "Статья")}</div>
          ${url ? `<div class="hint">🔗 <a class="url-link" href="${esc(url)}" target="_blank" rel="noopener">${esc(url)}</a></div>` : ""}
          <details>
            <summary>🔍 Фактчекинг</summary>
            <div class="factcheck">${esc(a.factcheck || "отчёт недоступен")}</div>
          </details>
          <div class="article-body">${a.article || ""}</div>
          <div class="art-actions">
            <button class="btn small green" data-act="pub" data-id="${a.id}">📤 Опубликовать на Telegraph</button>
            <button class="btn small" data-act="copy-h">📋 Копировать HTML</button>
            <button class="btn small" data-act="copy-t">📋 Копировать текст</button>
          </div>
        `;
        div
          .querySelector('[data-act="pub"]')
          .addEventListener("click", () => onPublish(a.id));
        div
          .querySelector('[data-act="copy-h"]')
          .addEventListener("click", async () => {
            try {
              await navigator.clipboard.writeText(a.article || "");
              toast("HTML скопирован", "ok");
            } catch (e) {
              toast("Не удалось скопировать: " + e.message, "err");
            }
          });
        div
          .querySelector('[data-act="copy-t"]')
          .addEventListener("click", async () => {
            try {
              await navigator.clipboard.writeText(stripHtml(a.article));
              toast("Текст скопирован", "ok");
            } catch (e) {
              toast("Не удалось скопировать: " + e.message, "err");
            }
          });
        return div;
      }
      async function onPublish(articleId) {
        const btn = document.querySelector(
          `[data-act="pub"][data-id="${articleId}"]`,
        );
        if (btn) btn.disabled = true;
        try {
          const data = await api(`/api/articles/${articleId}/publish`, {
            method: "POST",
          });
          const card = document.querySelector(`[data-art-id="${articleId}"]`);
          if (card) {
            card.insertAdjacentHTML(
              "afterbegin",
              `<div class="hint">🔗 Опубликовано: <a class="url-link" href="${esc(data.url)}" target="_blank" rel="noopener">${esc(data.url)}</a></div>`,
            );
          }
          toast("Опубликовано на Telegraph", "ok");
        } catch (e) {
          toast(e.message, "err");
        } finally {
          if (btn) btn.disabled = false;
        }
      }
      async function loadArticles() {
        const data = await api("/api/articles");
        S.articles = data.articles;
        $("articles-count").textContent = "(" + S.articles.length + ")";
        const wrap = $("articles");
        wrap.innerHTML = "";
        if (!S.articles.length) {
          wrap.innerHTML = `<p class="empty">Статей пока нет. Выбери тему → «Сгенерировать план» → отредактируй → «Отправить на генерацию статьи».</p>`;
          return;
        }
        S.articles.forEach((a) => wrap.appendChild(articleCard(a)));
        renderStats();
      }

      // ---------- Инициализация ----------
      async function init() {
        $("btn-collect").addEventListener("click", onCollect);
        $("btn-select").addEventListener("click", onSelect);
        $("btn-refresh").addEventListener("click", refreshAll);
        await refreshAll();
      }
      async function refreshAll() {
        $("btn-refresh").disabled = true;
        try {
          await Promise.allSettled([
            loadStatus(),
            loadPlatforms(),
            loadTopics(),
            loadArticles(),
          ]);
        } finally {
          $("btn-refresh").disabled = false;
        }
      }
      async function loadPlatforms() {
        const data = await api("/api/platforms");
        S.platforms = data.platforms;
      }
      init();
    </script>
  </body>
</html>
